<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kitchen Family Photo Hub - Split-Screen Roast Battle</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f19">

  <style>
    :root {
      --bg: #0b0f19;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --accent-blue: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body, html {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 10;
      overflow: hidden;
    }

    .screen.hidden { display: none !important; }

    header {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      height: 60px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-gold);
    }

    .controls { display: flex; align-items: center; gap: 8px; }

    .btn {
      background: var(--accent-blue);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .btn:active { transform: scale(0.95); }
    .btn-secondary { background: rgba(255, 255, 255, 0.12); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.15); }
    .btn-red { background: var(--accent-red); color: #fff; }

    /* --- SCREENSAVER VIEW --- */
    #screensaver-view { background: #0b0f19; z-index: 20; }

    #bg-blur-img {
      position: absolute;
      inset: -20px;
      width: calc(100vw + 40px);
      height: calc(100dvh + 40px);
      object-fit: cover;
      filter: blur(35px) brightness(0.45) saturate(1.3);
      transform: scale(1.08);
      z-index: 21;
    }

    #sparkle-canvas { position: absolute; inset: 0; width: 100vw; height: 100dvh; z-index: 22; pointer-events: none; }

    #photo-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      z-index: 23;
      padding: 30px;
    }

    .saver-single-img {
      max-width: 96vw;
      max-height: 94dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }

    .saver-controls-top-left { 
      position: absolute; top: 20px; left: 20px; display: flex; gap: 8px; z-index: 25; align-items: center; 
      background: rgba(15, 23, 42, 0.65); padding: 8px 12px; border-radius: 16px; backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .saver-controls-top-right { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center; z-index: 25; }

    .speed-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.9);
      padding: 6px 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }

    /* --- GALLERY VIEW --- */
    #main-view {
      padding-top: 84px; padding-bottom: 20px; width: 100vw; height: 100dvh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; z-index: 20;
    }
    .gallery-toolbar { display: flex; align-items: center; justify-content: space-between; width: 90vw; max-width: 1200px; margin-bottom: 16px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; width: 90vw; max-width: 1200px; padding-bottom: 40px; }
    .photo-card { background: rgba(30, 41, 59, 0.85); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; }
    .photo-card-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; }
    .photo-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .delete-card-btn { position: absolute; top: 10px; left: 10px; background: rgba(239, 68, 68, 0.85); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; z-index: 10; }

    /* --- SPLIT-SCREEN ROAST GAME VIEW --- */
    #roast-game-view {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh; height: 100dvh;
      padding-top: 84px;
      background: var(--bg);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    .split-board {
      flex: 1; width: 100%; height: 100%;
      display: grid; gap: 6px;
      background: #020617; padding: 8px; overflow: hidden;
    }
    .split-board.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .split-board.layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .split-board.layout-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .split-board.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .player-quadrant {
      background: var(--panel-bg);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex; flex-direction: column;
      padding: 12px; gap: 8px;
      overflow-y: auto; position: relative;
    }

    .quad-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; flex-shrink: 0;
    }
    .quad-title { font-weight: 800; color: var(--accent-gold); font-size: 1.05rem; }
    .quad-status { font-size: 0.8rem; color: var(--text-muted); }

    /* CARD STYLING */
    .cah-card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border: 1px solid #cbd5e1;
      transition: transform 0.2s ease, background 0.2s ease;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 85px;
    }
    .cah-card:hover { transform: translateY(-3px); background: #f8fafc; border-color: var(--accent-red); }
    .cah-card-footer { font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; }

    .photo-choices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex-shrink: 0; }
    .choice-photo-thumb {
      width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.25); cursor: pointer; transition: transform 0.2s ease;
    }
    .choice-photo-thumb:hover { transform: scale(1.04); border-color: var(--accent-gold); }

    .active-photo-preview {
      width: 100%; max-height: 140px; object-fit: contain; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); flex-shrink: 0;
    }

    /* VOTING STAGE */
    #voting-stage {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: var(--bg); overflow-y: auto;
    }
    .vote-arena {
      background: var(--panel-bg); border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 24px;
      width: 90vw; max-width: 650px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .vote-photo { width: 100%; max-height: 320px; object-fit: contain; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); }
    .submissions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; width: 100%; }

    /* MODALS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 300; display: flex; align-items: center; justify-content: center; }
    .modal-overlay.hidden { display: none !important; }
    .modal-box { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 24px; width: 90vw; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
    .modal-box h2 { color: var(--accent-gold); text-align: center; }

    .player-input-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .player-input-row input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px; color: #fff; font-size: 1rem; }

    #status-toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #0284c7; color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; z-index: 1000; transition: opacity 0.3s ease; }
    .toast-hidden { opacity: 0; pointer-events: none; }
    #empty-state { text-align: center; padding: 40px; background: var(--panel-bg); border-radius: 24px; max-width: 440px; margin-top: 100px; }
  </style>
</head>
<body>

  <div id="status-toast" class="toast-hidden">Processing photos...</div>

  <header>
    <div class="brand">
      <span>🖼️</span>
      <span>Kitchen Family Photo Hub</span>
    </div>
    <div class="controls">
      <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
      <button class="btn" onclick="document.getElementById('file-input').click()">+ Select Photos</button>
      <button class="btn btn-secondary" onclick="toggleView('main')">📸 Gallery</button>
      <button class="btn btn-red" onclick="openRoastSetupModal()">🔥 Roast Game</button>
      <button class="btn btn-secondary" onclick="toggleView('saver')">🖼️ Screensaver</button>
      <button class="btn btn-secondary" onclick="toggleFullscreen()" title="Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- Screensaver View -->
  <div id="screensaver-view" class="screen">
    <img id="bg-blur-img" src="" alt="Ambient Background">
    <canvas id="sparkle-canvas"></canvas>
    <div class="saver-controls-top-left">
      <button class="speed-btn" onclick="prevSlide()" title="Previous Image">⏮️ Back</button>
      <button id="pause-play-btn" class="speed-btn" onclick="togglePauseScreensaver()" title="Pause/Play">⏸️ Pause</button>
    </div>
    <div class="saver-controls-top-right">
      <button class="speed-btn" onclick="toggleView('main')">✕ Exit</button>
    </div>
    <div id="photo-container">
      <div id="empty-state">
        <h2 style="color:var(--accent-gold); margin-bottom:12px;">No Photos Loaded</h2>
        <p style="color:var(--text-muted);">Tap <strong>"+ Select Photos"</strong> to load your family images.</p>
      </div>
      <div id="saver-content-wrap" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; opacity:0; transition: opacity 0.3s ease-in-out;"></div>
    </div>
  </div>

  <!-- Gallery View -->
  <div id="main-view" class="screen hidden">
    <div class="gallery-toolbar">
      <h2 style="color: var(--accent-gold);">Family Photo Gallery</h2>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <!-- Split-Screen Roast Battle Game View -->
  <div id="roast-game-view" class="screen hidden">
    <div id="split-board-container" class="split-board layout-4"></div>
  </div>

  <!-- Roast Setup Modal (1-4 Players) -->
  <div id="roast-setup-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>🔥 Roast Battle Setup</h2>
      
      <div class="setting-group" style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-weight:700; color:var(--text-muted); font-size:0.9rem;">Number of Players (1-4):</label>
        <select id="player-count-select" class="btn btn-secondary" style="width:100%; font-size:1rem; outline:none;" onchange="updatePlayerInputRows()">
          <option value="1">1 Player</option>
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4" selected>4 Players</option>
        </select>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px; margin-top:4px;">
        <label style="font-weight:700; color:var(--text-muted); font-size:0.9rem;">Player Names:</label>
        <div id="player-inputs-container">
          <div class="player-input-row"><input type="text" class="player-name-input" value="Bee" placeholder="Player 1"></div>
          <div class="player-input-row"><input type="text" class="player-name-input" value="Les" placeholder="Player 2"></div>
          <div class="player-input-row"><input type="text" class="player-name-input" value="Chrissy" placeholder="Player 3"></div>
          <div class="player-input-row"><input type="text" class="player-name-input" value="Casey" placeholder="Player 4"></div>
        </div>
      </div>

      <div style="display:flex; gap:12px; margin-top:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeRoastSetupModal()">Cancel</button>
        <button class="btn btn-red" style="flex:1;" onclick="startSplitRoastGame()">Start Battle 🔥</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox-modal" class="modal-overlay hidden" onclick="closeLightbox()">
    <div style="position:relative; display:flex; flex-direction:column; align-items:center;" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Enlarged Photo" style="max-width:90vw; max-height:80vh; object-fit:contain; border-radius:16px;">
      <button class="btn btn-secondary" style="margin-top:12px;" onclick="closeLightbox()">Close</button>
    </div>
  </div>

  <script>
    let db = null;
    let photosList = [];
    let activeScreensaverPool = [];
    let sequenceIndices = [];
    let sequencePointer = 0;
    let isPaused = false;
    let slideshowTimer = null;

    const ROAST_DECK = [
      "Ugly as fuck.",
      "Fat.",
      "Who the hell dressed you?",
      "Who let you out looking like that?",
      "Looks like a sack of potatoes in clothes.",
      "10/10 would avoid in public.",
      "Looking like a thumb with a wig on.",
      "Your face looks like a slapped ass.",
      "Did you get dressed in the dark?",
      "What an absolute eyesore.",
      "Looking like a human mistake.",
      "Jesus christ, what happened to you?",
      "Looking like you smell of boiled hotdog water.",
      "The human embodiment of a wet carpet.",
      "Bro looks like a budget horror movie villain.",
      "Looking like you get rejected by mirrors.",
      "An absolute disgrace to fashion.",
      "Did you steal those clothes from a homeless bin?",
      "Zero beauty, zero brains.",
      "Looking like a boiled turnip.",
      "Who hurt you to make you look like this?",
      "Looking like your hair was cut with a lawnmower.",
      "Absolute donkey-brained look.",
      "Looking like a foot.",
      "Who told you that outfit looked good? They lied.",
      "Looking like you haven't slept since 2012.",
      "Face like a melted candle.",
      "Looking like you belong in a circus freakshow.",
      "An absolute clown.",
      "Looking like a sack of bad decisions.",
      "Who let this creature into the house?",
      "Looking like you smell of stale beer and regret.",
      "What a fucking disaster.",
      "Looking like a bargain bin mannequin.",
      "The face only a blind mother could love.",
      "Looking like a crushed soda can.",
      "Did you fight a badger for that outfit?",
      "Looking like a moldy potato.",
      "Pure trash energy.",
      "Looking like you haven't washed in three weeks."
    ];

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('status-toast');
      toast.innerText = msg;
      toast.classList.remove('toast-hidden');
      setTimeout(() => toast.classList.add('toast-hidden'), duration);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('CoylaFamilyPhotoHubDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(true); };
        req.onerror = () => resolve(false);
      });
    }

    async function savePhotoToDB(photoObj) {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').put(photoObj);
        tx.oncomplete = () => resolve();
      });
    }

    async function loadPhotosFromDB() {
      if (!db) return [];
      return new Promise((resolve) => {
        const tx = db.transaction('photos', 'readonly');
        const req = tx.objectStore('photos').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function deletePhotoFromDB(photoId) {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').delete(photoId);
        tx.oncomplete = () => resolve();
      });
    }

    function resizeHighRes(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const maxDimension = 1200;
            if (w > h) { if (w > maxDimension) { h = Math.round((h * maxDimension) / w); w = maxDimension; } }
            else { if (h > maxDimension) { w = Math.round((h * maxDimension) / h); h = maxDimension; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.88), portrait: h > w });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      photosList = await loadPhotosFromDB();
      activeScreensaverPool = [...photosList];
      buildTimesTableSequence();
      
      if (photosList.length > 0) {
        startScreensaver();
        renderGallery();
      }

      document.getElementById('file-input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) return;
        showToast(`Processing ${files.length} photo(s)...`, 4000);
        for (let file of files) {
          const res = await resizeHighRes(file);
          if (res) {
            const photoObj = { id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4), dataUrl: res.dataUrl, portrait: res.portrait };
            photosList.push(photoObj);
            await savePhotoToDB(photoObj);
          }
        }
        activeScreensaverPool = [...photosList];
        buildTimesTableSequence();
        toggleView('main');
        startScreensaver();
      });
    });

    // --- SCREENSAVER LOGIC ---
    function buildTimesTableSequence() {
      const len = activeScreensaverPool.length;
      if (len === 0) { sequenceIndices = []; return; }
      sequenceIndices = Array.from({length: len}, (_, i) => i).sort(() => Math.random() - 0.5);
      sequencePointer = 0;
    }

    function startScreensaver() {
      if (activeScreensaverPool.length === 0) return;
      document.getElementById('empty-state').style.display = 'none';
      if (slideshowTimer) clearInterval(slideshowTimer);
      displayCurrentPhoto();
      slideshowTimer = setInterval(() => { if (!isPaused) displayCurrentPhoto(); }, 6000);
    }

    function displayCurrentPhoto() {
      if (activeScreensaverPool.length === 0) return;
      if (sequencePointer >= sequenceIndices.length) sequencePointer = 0;
      const idx = sequenceIndices[sequencePointer++];
      const photo = activeScreensaverPool[idx];
      
      document.getElementById('bg-blur-img').src = photo.dataUrl;
      const wrap = document.getElementById('saver-content-wrap');
      wrap.style.opacity = '0';
      setTimeout(() => {
        wrap.innerHTML = `<img src="${photo.dataUrl}" class="saver-single-img">`;
        wrap.style.opacity = '1';
      }, 150);
    }

    function prevSlide() { displayCurrentPhoto(); }
    function togglePauseScreensaver() {
      isPaused = !isPaused;
      document.getElementById('pause-play-btn').innerText = isPaused ? '▶️ Play' : '⏸️ Pause';
    }

    // --- GAME ENGINE LOGIC ---
    let activeGamePlayers = [];
    let playerScores = {};
    let playerStates = {};
    let sharedRoundPhotos = [];
    let votingQueue = [];
    let currentVotingIndex = 0;

    function openRoastSetupModal() {
      if (photosList.length < 3) { alert("Please upload at least 3 photos first using '+ Select Photos'!"); return; }
      document.getElementById('roast-setup-modal').classList.remove('hidden');
    }

    function closeRoastSetupModal() {
      document.getElementById('roast-setup-modal').classList.add('hidden');
    }

    function updatePlayerInputRows() {
      const count = parseInt(document.getElementById('player-count-select').value);
      const container = document.getElementById('player-inputs-container');
      const defaultNames = ['Bee', 'Les', 'Chrissy', 'Casey'];
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        container.innerHTML += `<div class="player-input-row"><input type="text" class="player-name-input" value="${defaultNames[i] || 'Player ' + (i+1)}" placeholder="Player ${i+1}"></div>`;
      }
    }

    function startSplitRoastGame() {
      const inputs = document.querySelectorAll('.player-name-input');
      activeGamePlayers = [];
      inputs.forEach(input => {
        const val = input.value.trim();
        if (val) activeGamePlayers.push(val);
      });

      if (activeGamePlayers.length === 0) { alert("Please enter at least 1 player name!"); return; }
      
      closeRoastSetupModal();
      toggleView('roast');

      playerScores = {};
      activeGamePlayers.forEach(p => playerScores[p] = 0);

      initNewRound();
    }

    function initNewRound() {
      // Pick 3 SHARED photos for ALL players this round
      let pool = [...photosList].sort(() => Math.random() - 0.5);
      sharedRoundPhotos = pool.slice(0, 3);

      playerStates = {};
      activeGamePlayers.forEach(player => {
        let hand = [...ROAST_DECK].sort(() => Math.random() - 0.5).slice(0, 3); // 3 card hand (one per photo)
        playerStates[player] = {
          step: 0, // 0: img1, 1: card1, 2: img2, 3: card2, 4: img3, 5: card3, 6: done
          selectedPhotos: [],
          selectedCards: [],
          hand: hand
        };
      });

      renderSplitBoard();
    }

    function renderSplitBoard() {
      const boardContainer = document.getElementById('split-board-container');
      const numPlayers = activeGamePlayers.length;
      
      boardContainer.className = `split-board layout-${numPlayers}`;
      boardContainer.innerHTML = '';

      activeGamePlayers.forEach(player => {
        const quad = document.createElement('div');
        quad.className = 'player-quadrant';
        quad.id = `quad-${player}`;
        
        refreshQuadrant(player, quad);
        boardContainer.appendChild(quad);
      });
    }

    function refreshQuadrant(player, quadElement) {
      const state = playerStates[player];
      const score = playerScores[player];

      if (state.step >= 6) {
        quadElement.innerHTML = `
          <div class="quad-header">
            <span class="quad-title">👤 ${player}</span>
            <span class="quad-score">${score} pts</span>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;">
            <h3 style="color:var(--accent-green);">✅ Roasts Locked In!</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Waiting for other players to finish...</p>
          </div>
        `;
        checkAllPlayersFinished();
        return;
      }

      let isPhotoTurn = (state.step % 2 === 0);
      let stepNum = Math.floor(state.step / 2) + 1; // 1, 2, or 3

      if (isPhotoTurn) {
        // The player must select the specific SHARED photo for this step (index step/2)
        const targetPhoto = sharedRoundPhotos[(state.step / 2)];
        
        quadElement.innerHTML = `
          <div class="quad-header">
            <span class="quad-title">👤 ${player}</span>
            <span class="quad-score">${score} pts</span>
          </div>
          <div class="quad-status">Round Step ${stepNum} of 3</div>
          <p style="color:var(--accent-gold); font-size:0.85rem; font-weight:bold; margin-top:2px;">Select Image ${stepNum}:</p>
          <div class="photo-choices-grid" style="grid-template-columns: 1fr;">
            <img src="${targetPhoto.dataUrl}" class="choice-photo-thumb" style="aspect-ratio: 16/9; max-height:160px; object-fit:contain;" onclick="playerPickPhoto('${player}', \`${targetPhoto.dataUrl}\`)">
          </div>
        `;
      } else {
        let currentPhoto = state.selectedPhotos[state.selectedPhotos.length - 1];
        quadElement.innerHTML = `
          <div class="quad-header">
            <span class="quad-title">👤 ${player}</span>
            <span class="quad-score">${score} pts</span>
          </div>
          <img src="${currentPhoto}" class="active-photo-preview">
          <div class="quad-status">Choose Roast Card for Image ${stepNum}</div>
          <div class="roast-choices-stack">
            ${state.hand.map((cardText, cIdx) => `
              <div class="cah-card" onclick="playerPickCard('${player}', ${cIdx})">
                <span>"${cardText}"</span>
                <div class="cah-card-footer">Kitchen Family Hub</div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function playerPickPhoto(player, dataUrl) {
      const state = playerStates[player];
      state.selectedPhotos.push(dataUrl);
      state.step++;
      refreshQuadrant(player, document.getElementById(`quad-${player}`));
    }

    function playerPickCard(player, cardIndex) {
      const state = playerStates[player];
      const chosenCard = state.hand.splice(cardIndex, 1)[0];
      state.selectedCards.push(chosenCard);
      state.step++;
      refreshQuadrant(player, document.getElementById(`quad-${player}`));
    }

    function checkAllPlayersFinished() {
      let allDone = activeGamePlayers.every(p => playerStates[p].step >= 6);
      if (allDone) {
        startVotingPhase();
      }
    }

    // --- VOTING PHASE ---
    function startVotingPhase() {
      votingQueue = [];
      // Build 3 image voting items based on shared round photos
      for (let i = 0; i < 3; i++) {
        let submissions = activeGamePlayers.map(player => ({
          player: player,
          card: playerStates[player].selectedCards[i]
        }));
        votingQueue.push({
          photo: sharedRoundPhotos[i].dataUrl,
          submissions: submissions.sort(() => Math.random() - 0.5)
        });
      }

      currentVotingIndex = 0;
      renderVotingScreen();
    }

    function renderVotingScreen() {
      if (currentVotingIndex >= votingQueue.length) {
        showWinnerScreen();
        return;
      }

      const item = votingQueue[currentVotingIndex];
      const container = document.getElementById('roast-game-view');
      
      container.innerHTML = `
        <div id="voting-stage">
          <div class="vote-arena">
            <h2 style="color:var(--accent-gold);">🗳️ Voting Time (Image ${currentVotingIndex + 1} of 3)</h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">Read the cards out loud, then click the funniest one to award points!</p>
            
            <img src="${item.photo}" class="vote-photo">

            <div class="submissions-grid">
              ${item.submissions.map((sub) => `
                <div class="cah-card" onclick="voteForSubmission('${sub.player}')" style="background:#fff; cursor:pointer;">
                  <div>
                    <div style="font-size:0.75rem; color:#94a3b8; font-weight:bold; margin-bottom:4px;">Submitted by ${sub.player}</div>
                    <span style="font-size:1.05rem; font-style:italic;">"${sub.card}"</span>
                  </div>
                  <div class="cah-card-footer" style="color:var(--accent-red); font-weight:bold; text-align:right;">👉 Click to Vote (+15 pts)</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function voteForSubmission(winningPlayer) {
      playerScores[winningPlayer] += 15;
      showToast(`🏆 +15 pts awarded to ${winningPlayer}!`);
      currentVotingIndex++;
      setTimeout(renderVotingScreen, 600);
    }

    function showWinnerScreen() {
      let sorted = [...activeGamePlayers].sort((a, b) => playerScores[b] - playerScores[a]);
      let winner = sorted[0];

      const container = document.getElementById('roast-game-view');
      container.innerHTML = `
        <div id="voting-stage">
          <div class="vote-arena" style="text-align:center;">
            <h1 style="color:var(--accent-gold); font-size:2.5rem;">👑 Roast Battle Winner!</h1>
            <h2 style="color:#fff; font-size:1.8rem; margin:10px 0;">${winner} with ${playerScores[winner]} points!</h2>
            
            <div style="width:100%; margin:15px 0; border-top:1px solid rgba(255,255,255,0.15); padding-top:15px;">
              <h3 style="color:var(--text-muted); margin-bottom:8px;">Final Scoreboard</h3>
              ${sorted.map(p => `<div style="display:flex; justify-content:space-between; font-weight:bold; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,0.08);"><span>${p}</span><span style="color:var(--accent-gold);">${playerScores[p]} pts</span></div>`).join('')}
            </div>

            <div style="display:flex; gap:12px; width:100%; margin-top:10px;">
              <button class="btn btn-secondary" style="flex:1;" onclick="toggleView('main')">📸 Exit to Gallery</button>
              <button class="btn btn-red" style="flex:1;" onclick="openRoastSetupModal()">🔄 Play Again</button>
            </div>
          </div>
        </div>
      `;
    }

    // --- GALLERY LOGIC ---
    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      photosList.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.onclick = () => {
          document.getElementById('lightbox-img').src = photo.dataUrl;
          document.getElementById('lightbox-modal').classList.remove('hidden');
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-card-btn';
        delBtn.innerText = '🗑️';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if (confirm("Delete this photo?")) {
            photosList = photosList.filter(p => p.id !== photo.id);
            activeScreensaverPool = activeScreensaverPool.filter(p => p.id !== photo.id);
            await deletePhotoFromDB(photo.id);
            renderGallery();
            showToast("Photo deleted");
          }
        };

        const wrap = document.createElement('div');
        wrap.className = 'photo-card-img-wrap';
        wrap.innerHTML = `<img src="${photo.dataUrl}">`;

        card.appendChild(delBtn);
        card.appendChild(wrap);
        grid.appendChild(card);
      });
    }

    function closeLightbox() { document.getElementById('lightbox-modal').classList.add('hidden'); }

    function toggleView(view) {
      document.getElementById('screensaver-view').classList.add('hidden');
      document.getElementById('main-view').classList.add('hidden');
      document.getElementById('roast-game-view').classList.add('hidden');
      closeRoastSetupModal();
      closeLightbox();

      if (view === 'saver') {
        document.getElementById('screensaver-view').classList.remove('hidden');
        startScreensaver();
      } else if (view === 'main') {
        document.getElementById('main-view').classList.remove('hidden');
        renderGallery();
        if (slideshowTimer) clearInterval(slideshowTimer);
      } else if (view === 'roast') {
        document.getElementById('roast-game-view').classList.remove('hidden');
        if (slideshowTimer) clearInterval(slideshowTimer);
      }
    }
  </script>
</body>
</html>
