<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kitchen Family Photo Hub - Split-Screen Roast</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f19">

  <style>
    :root {
      --bg: #0b0f19;
      --panel-bg: rgba(15, 23, 42, 0.95);
      --accent-blue: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body, html {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      transition: filter 0.5s ease;
    }

    body.night-mode { filter: brightness(0.12) contrast(1.1); }

    .screen {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: opacity 0.3s ease;
      z-index: 10;
      overflow: hidden;
    }

    .screen.hidden { opacity: 0; pointer-events: none; }

    header {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      height: 60px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-gold);
    }

    .controls { display: flex; align-items: center; gap: 8px; }

    .btn {
      background: var(--accent-blue);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .btn:active { transform: scale(0.95); }
    .btn-secondary { background: rgba(255, 255, 255, 0.12); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.15); }
    .btn-red { background: var(--accent-red); color: #fff; }

    /* --- SCREENSAVER VIEW --- */
    #screensaver-view { background: #0b0f19; z-index: 200; overflow: hidden; }

    #bg-blur-img {
      position: absolute;
      inset: -20px;
      width: calc(100vw + 40px);
      height: calc(100dvh + 40px);
      object-fit: cover;
      filter: blur(35px) brightness(0.45) saturate(1.3);
      transform: scale(1.08);
      transition: opacity 0.3s ease-in-out;
      z-index: 201;
    }

    #sparkle-canvas { position: absolute; inset: 0; width: 100vw; height: 100dvh; z-index: 202; pointer-events: none; }

    #photo-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      z-index: 203;
      padding: 30px;
    }

    .saver-single-img {
      max-width: 96vw;
      max-height: 94dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }

    .saver-controls-top-left { 
      position: absolute; top: 20px; left: 20px; display: flex; gap: 8px; z-index: 210; align-items: center; 
      background: rgba(15, 23, 42, 0.65); padding: 8px 12px; border-radius: 16px; backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .saver-controls-top-right { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; align-items: center; z-index: 210; }

    .speed-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.9);
      padding: 6px 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }

    /* --- GALLERY VIEW --- */
    #main-view {
      padding-top: 84px; padding-bottom: 20px; width: 100vw; height: 100dvh; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
    }
    .gallery-toolbar { display: flex; align-items: center; justify-content: space-between; width: 90vw; max-width: 1200px; margin-bottom: 16px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; width: 90vw; max-width: 1200px; padding-bottom: 40px; }
    .photo-card { background: rgba(30, 41, 59, 0.85); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; }
    .photo-card-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; }
    .photo-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .delete-card-btn { position: absolute; top: 10px; left: 10px; background: rgba(239, 68, 68, 0.85); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; z-index: 10; }

    /* --- SPLIT-SCREEN ROAST GAME VIEW --- */
    #roast-game-view {
      padding-top: 84px;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .split-board {
      flex: 1;
      width: 100vw;
      height: calc(100dvh - 84px);
      display: grid;
      gap: 4px;
      background: #020617;
      overflow: hidden;
    }

    .split-board.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .split-board.layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .split-board.layout-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .split-board.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .player-quadrant {
      background: var(--panel-bg);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 8px;
      overflow-y: auto;
      position: relative;
    }

    .quad-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
      flex-shrink: 0;
    }

    .quad-title { font-weight: 800; color: var(--accent-gold); font-size: 1rem; }
    .quad-score { background: rgba(239,68,68,0.2); border: 1px solid var(--accent-red); padding: 2px 10px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; }

    .photo-choices-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .choice-photo-thumb {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .choice-photo-thumb:hover { transform: scale(1.03); border-color: var(--accent-gold); }

    .active-photo-preview {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    .roast-choices-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .choice-roast-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 700;
      color: #f8fafc;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .choice-roast-btn:hover { background: rgba(239, 68, 68, 0.25); border-color: var(--accent-red); }

    /* --- MODALS --- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 300; display: flex; align-items: center; justify-content: center; }
    .modal-overlay.hidden { display: none !important; }
    .modal-box { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 24px; width: 90vw; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
    .modal-box h2 { color: var(--accent-gold); text-align: center; }

    .player-input-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .player-input-row input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px; color: #fff; font-size: 1rem; }

    #status-toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #0284c7; color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; z-index: 1000; transition: opacity 0.3s ease; }
    .toast-hidden { opacity: 0; pointer-events: none; }
    #empty-state { text-align: center; padding: 40px; background: var(--panel-bg); border-radius: 24px; max-width: 440px; margin-top: 100px; }
  </style>
</head>
<body>

  <div id="status-toast" class="toast-hidden">Processing photos...</div>

  <header>
    <div class="brand">
      <span>🖼️</span>
      <span>Kitchen Family Photo Hub</span>
    </div>
    <div class="controls">
      <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
      <button class="btn" onclick="document.getElementById('file-input').click()">+ Select Photos</button>
      <button class="btn btn-secondary" onclick="toggleView('main')">📸 Gallery</button>
      <button class="btn btn-red" onclick="openRoastSetupModal()">🔥 Roast Game (1-4P)</button>
      <button class="btn btn-secondary" onclick="toggleView('saver')">🖼️ Screensaver</button>
      <button class="btn btn-secondary" onclick="toggleFullscreen()" title="Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <!-- Screensaver View -->
  <div id="screensaver-view" class="screen">
    <img id="bg-blur-img" src="" alt="Ambient Background">
    <canvas id="sparkle-canvas"></canvas>
    <div class="saver-controls-top-left">
      <button class="speed-btn" onclick="prevSlide()">⏮️ Back</button>
      <button id="pause-play-btn" class="speed-btn" onclick="togglePauseScreensaver()">⏸️ Pause</button>
    </div>
    <div class="saver-controls-top-right">
      <button class="speed-btn" onclick="toggleView('main')">✕ Exit</button>
    </div>
    <div id="photo-container">
      <div id="empty-state">
        <h2 style="color:var(--accent-gold); margin-bottom:12px;">No Photos Loaded</h2>
        <p style="color:var(--text-muted);">Tap <strong>"+ Select Photos"</strong> to load your family images.</p>
      </div>
      <div id="saver-content-wrap" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; opacity:0; transition: opacity 0.3s ease-in-out;"></div>
    </div>
  </div>

  <!-- Gallery View -->
  <div id="main-view" class="screen hidden">
    <div class="gallery-toolbar">
      <h2 style="color: var(--accent-gold);">Family Photo Gallery</h2>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <!-- Split-Screen Roast Battle Game View -->
  <div id="roast-game-view" class="screen hidden">
    <div id="split-board-container" class="split-board layout-4"></div>
  </div>

  <!-- Roast Setup Modal (1-4 Players) -->
  <div id="roast-setup-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>🔥 Split-Screen Roast Setup</h2>
      <p style="color:var(--text-muted); font-size:0.9rem;">Enter names for active players (leave blank to omit):</p>
      
      <div id="player-inputs-container">
        <div class="player-input-row"><input type="text" class="player-name-input" value="Bee" placeholder="Player 1"></div>
        <div class="player-input-row"><input type="text" class="player-name-input" value="Les" placeholder="Player 2"></div>
        <div class="player-input-row"><input type="text" class="player-name-input" value="Chrissy" placeholder="Player 3"></div>
        <div class="player-input-row"><input type="text" class="player-name-input" value="Casey" placeholder="Player 4"></div>
      </div>

      <div style="display:flex; gap:12px; margin-top:10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeRoastSetupModal()">Cancel</button>
        <button class="btn btn-red" style="flex:1;" onclick="startSplitRoastGame()">Start Split-Screen 🔥</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox-modal" class="modal-overlay hidden" onclick="closeLightbox()">
    <div style="position:relative; display:flex; flex-direction:column; align-items:center;" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Enlarged Photo" style="max-width:90vw; max-height:80vh; object-fit:contain; border-radius:16px;">
      <button class="btn btn-secondary" style="margin-top:12px;" onclick="closeLightbox()">Close</button>
    </div>
  </div>

  <script>
    let db = null;
    let photosList = [];
    let activeScreensaverPool = [];
    let sequenceIndices = [];
    let sequencePointer = 0;
    let isPaused = false;
    let slideshowTimer = null;

    // MASSIVE RUDE & INSULTING DECK
    const ROAST_DECK = [
      "Ugly as fuck.",
      "Fat.",
      "Who the hell dressed you?",
      "Who let you out looking like that?",
      "Looks like a sack of potatoes in clothes.",
      "10/10 would avoid in public.",
      "Looking like a thumb with a wig on.",
      "Your face looks like a slapped ass.",
      "Did you get dressed in the dark?",
      "What an absolute eyesore.",
      "Looking like a human mistake.",
      "Jesus christ, what happened to you?",
      "Looking like you smell of boiled hotdog water.",
      "The human embodiment of a wet carpet.",
      "Bro looks like a budget horror movie villain.",
      "Looking like you get rejected by mirrors.",
      "An absolute disgrace to fashion.",
      "Did you steal those clothes from a homeless bin?",
      "Zero beauty, zero brains.",
      "Looking like a boiled turnip.",
      "Who hurt you to make you look like this?",
      "Looking like your hair was cut with a lawnmower.",
      "Absolute donkey-brained look.",
      "Looking like a foot.",
      "Who told you that outfit looked good? They lied.",
      "Looking like you haven't slept since 2012.",
      "Face like a melted candle.",
      "Looking like you belong in a circus freakshow.",
      "An absolute clown.",
      "Looking like a sack of bad decisions.",
      "Who let this creature into the house?",
      "Looking like you smell of stale beer and regret.",
      "What a fucking disaster.",
      "Looking like a bargain bin mannequin.",
      "The face only a blind mother could love.",
      "Looking like a crushed soda can.",
      "Did you fight a badger for that outfit?",
      "Looking like a moldy potato.",
      "Pure trash energy.",
      "Looking like you haven't washed in three weeks."
    ];

    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('status-toast');
      toast.innerText = msg;
      toast.classList.remove('toast-hidden');
      setTimeout(() => toast.classList.add('toast-hidden'), duration);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('CoylaFamilyPhotoHubDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(true); };
        req.onerror = () => resolve(false);
      });
    }

    async function savePhotoToDB(photoObj) {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').put(photoObj);
        tx.oncomplete = () => resolve();
      });
    }

    async function loadPhotosFromDB() {
      if (!db) return [];
      return new Promise((resolve) => {
        const tx = db.transaction('photos', 'readonly');
        const req = tx.objectStore('photos').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function deletePhotoFromDB(photoId) {
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').delete(photoId);
        tx.oncomplete = () => resolve();
      });
    }

    function resizeHighRes(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const maxDimension = 1200;
            if (w > h) { if (w > maxDimension) { h = Math.round((h * maxDimension) / w); w = maxDimension; } }
            else { if (h > maxDimension) { w = Math.round((w * maxDimension) / h); h = maxDimension; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.88), portrait: h > w });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      photosList = await loadPhotosFromDB();
      activeScreensaverPool = [...photosList];
      buildTimesTableSequence();
      
      if (photosList.length > 0) {
        startScreensaver();
        renderGallery();
      }

      document.getElementById('file-input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) return;
        showToast(`Processing ${files.length} photo(s)...`, 4000);
        for (let file of files) {
          const res = await resizeHighRes(file);
          if (res) {
            const photoObj = { id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4), dataUrl: res.dataUrl, portrait: res.portrait };
            photosList.push(photoObj);
            await savePhotoToDB(photoObj);
          }
        }
        activeScreensaverPool = [...photosList];
        buildTimesTableSequence();
        toggleView('main');
        startScreensaver();
      });
    });

    // --- SCREENSAVER LOGIC ---
    function buildTimesTableSequence() {
      const len = activeScreensaverPool.length;
      if (len === 0) { sequenceIndices = []; return; }
      sequenceIndices = Array.from({length: len}, (_, i) => i).sort(() => Math.random() - 0.5);
      sequencePointer = 0;
    }

    function startScreensaver() {
      if (activeScreensaverPool.length === 0) return;
      document.getElementById('empty-state').style.display = 'none';
      if (slideshowTimer) clearInterval(slideshowTimer);
      displayCurrentPhoto();
      slideshowTimer = setInterval(() => { if (!isPaused) displayCurrentPhoto(); }, 6000);
    }

    function displayCurrentPhoto() {
      if (activeScreensaverPool.length === 0) return;
      if (sequencePointer >= sequenceIndices.length) sequencePointer = 0;
      const idx = sequenceIndices[sequencePointer++];
      const photo = activeScreensaverPool[idx];
      
      document.getElementById('bg-blur-img').src = photo.dataUrl;
      const wrap = document.getElementById('saver-content-wrap');
      wrap.style.opacity = '0';
      setTimeout(() => {
        wrap.innerHTML = `<img src="${photo.dataUrl}" class="saver-single-img">`;
        wrap.style.opacity = '1';
      }, 150);
    }

    function prevSlide() { displayCurrentPhoto(); }
    function togglePauseScreensaver() {
      isPaused = !isPaused;
      document.getElementById('pause-play-btn').innerText = isPaused ? '▶️ Play' : '⏸️ Pause';
    }

    // --- SPLIT-SCREEN ROAST GAME LOGIC ---
    let activeGamePlayers = [];
    let playerScores = {};
    let playerStates = {}; // tracks selected photo per quadrant

    function openRoastSetupModal() {
      if (photosList.length < 3) { alert("Please upload at least 3 photos first using '+ Select Photos'!"); return; }
      document.getElementById('roast-setup-modal').classList.remove('hidden');
    }

    function closeRoastSetupModal() {
      document.getElementById('roast-setup-modal').classList.add('hidden');
    }

    function startSplitRoastGame() {
      const inputs = document.querySelectorAll('.player-name-input');
      activeGamePlayers = [];
      inputs.forEach(input => {
        const val = input.value.trim();
        if (val) activeGamePlayers.push(val);
      });

      if (activeGamePlayers.length === 0) { alert("Please enter at least 1 player name!"); return; }
      
      closeRoastSetupModal();
      toggleView('roast');

      playerScores = {};
      playerStates = {};
      activeGamePlayers.forEach(p => {
        playerScores[p] = 0;
        playerStates[p] = { selectedPhoto: null, dealtRoasts: [] };
      });

      renderSplitBoard();
    }

    function renderSplitBoard() {
      const boardContainer = document.getElementById('split-board-container');
      const numPlayers = activeGamePlayers.length;
      
      boardContainer.className = `split-board layout-${numPlayers}`;
      boardContainer.innerHTML = '';

      activeGamePlayers.forEach(player => {
        const quad = document.createElement('div');
        quad.className = 'player-quadrant';
        quad.id = `quad-${player}`;
        
        refreshQuadrant(player, quad);
        boardContainer.appendChild(quad);
      });
    }

    function refreshQuadrant(player, quadElement) {
      const state = playerStates[player];
      const score = playerScores[player];

      // If no photo is selected yet, let player pick from 3 random photos
      if (!state.selectedPhoto) {
        let threePhotos = [...photosList].sort(() => Math.random() - 0.5).slice(0, 3);
        
        quadElement.innerHTML = `
          <div class="quad-header">
            <span class="quad-title">👤 ${player}</span>
            <span class="quad-score">${score} pts</span>
          </div>
          <p style="color:var(--accent-gold); font-size:0.85rem; font-weight:bold; margin-top:4px;">1. Choose 1 of 3 Photos to Roast:</p>
          <div class="photo-choices-grid">
            ${threePhotos.map(p => `
              <img src="${p.dataUrl}" class="choice-photo-thumb" onclick="playerChoosePhoto('${player}', \`${p.dataUrl}\`)">
            `).join('')}
          </div>
        `;
      } else {
        // Photo chosen, now show 3 random roast options
        if (state.dealtRoasts.length === 0) {
          state.dealtRoasts = [...ROAST_DECK].sort(() => Math.random() - 0.5).slice(0, 3);
        }

        quadElement.innerHTML = `
          <div class="quad-header">
            <span class="quad-title">👤 ${player}</span>
            <span class="quad-score">${score} pts</span>
          </div>
          <img src="${state.selectedPhoto}" class="active-photo-preview">
          <p style="color:var(--accent-red); font-size:0.85rem; font-weight:bold;">2. Choose Your Best Roast:</p>
          <div class="roast-choices-stack">
            ${state.dealtRoasts.map(roast => `
              <div class="choice-roast-btn" onclick="playerCommitRoast('${player}')">
                "${roast}"
              </div>
            `).join('')}
          </div>
          <button class="btn btn-secondary" style="margin-top:auto; font-size:0.8rem; padding:4px;" onclick="playerResetPhoto('${player}')">🔄 Pick Different Photo</button>
        `;
      }
    }

    function playerChoosePhoto(player, dataUrl) {
      playerStates[player].selectedPhoto = dataUrl;
      playerStates[player].dealtRoasts = []; // reset roasts
      refreshQuadrant(player, document.getElementById(`quad-${player}`));
    }

    function playerResetPhoto(player) {
      playerStates[player].selectedPhoto = null;
      playerStates[player].dealtRoasts = [];
      refreshQuadrant(player, document.getElementById(`quad-${player}`));
    }

    function playerCommitRoast(player) {
      playerScores[player] += 10;
      showToast(`🔥 ${player} landed a brutal roast! (+10 pts)`);
      
      // Reset for next round automatically
      playerStates[player].selectedPhoto = null;
      playerStates[player].dealtRoasts = [];
      refreshQuadrant(player, document.getElementById(`quad-${player}`));
    }

    // --- GALLERY LOGIC ---
    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';
      photosList.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.onclick = () => {
          document.getElementById('lightbox-img').src = photo.dataUrl;
          document.getElementById('lightbox-modal').classList.remove('hidden');
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-card-btn';
        delBtn.innerText = '🗑️';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if (confirm("Delete this photo?")) {
            photosList = photosList.filter(p => p.id !== photo.id);
            activeScreensaverPool = activeScreensaverPool.filter(p => p.id !== photo.id);
            await deletePhotoFromDB(photo.id);
            renderGallery();
            showToast("Photo deleted");
          }
        };

        const wrap = document.createElement('div');
        wrap.className = 'photo-card-img-wrap';
        wrap.innerHTML = `<img src="${photo.dataUrl}">`;

        card.appendChild(delBtn);
        card.appendChild(wrap);
        grid.appendChild(card);
      });
    }

    function closeLightbox() { document.getElementById('lightbox-modal').classList.add('hidden'); }

    function toggleView(view) {
      document.getElementById('screensaver-view').classList.add('hidden');
      document.getElementById('main-view').classList.add('hidden');
      document.getElementById('roast-game-view').classList.add('hidden');
      closeRoastSetupModal();
      closeLightbox();

      if (view === 'saver') {
        document.getElementById('screensaver-view').classList.remove('hidden');
        startScreensaver();
      } else if (view === 'main') {
        document.getElementById('main-view').classList.remove('hidden');
        renderGallery();
        if (slideshowTimer) clearInterval(slideshowTimer);
      } else if (view === 'roast') {
        document.getElementById('roast-game-view').classList.remove('hidden');
        if (slideshowTimer) clearInterval(slideshowTimer);
      }
    }
  </script>
</body>
</html>
